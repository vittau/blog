<footer class="footer">
  <div class="container">
    <section class="author" aria-label="About the author">
      <div class="author__photo">
        <img src="{{ '/img/photo.webp' | relative_url }}" alt="{{ site.author }}" width="112" height="140" loading="lazy">
      </div>
      <div>
        <p class="kicker"><span class="kicker__accent">Written by {{ site.author }}</span></p>
        <p class="author__text">{{ site.description }}</p>
        <div class="author__links">
          <a href="{{ site.home_url }}">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-diamond"></use></svg>
            vitormach.dev
          </a>
          {% for network in site.social %}
          <a href="{{ network.url }}" target="_blank" rel="noopener">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#{{ network.icon }}"></use></svg>
            {{ network.title }}
          </a>
          {% endfor %}
          <a href="{{ '/feed.xml' | relative_url }}">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-rss"></use></svg>
            RSS
          </a>
        </div>
      </div>
    </section>

    <div class="footer__bar">
      <a class="brand" href="{{ site.home_url }}" aria-label="Vitor Machado, home page">
        <svg class="brand__mark" aria-hidden="true" focusable="false"><use href="#i-diamond"></use></svg>
        <span>vitor machado</span>
      </a>

      <p class="footer__legal">
        &copy; {{ site.time | date: "%Y" }} {{ site.author }}.
        Built with <a href="https://jekyllrb.com/" target="_blank" rel="noopener">Jekyll</a>,
        hosted on <a href="https://pages.github.com/" target="_blank" rel="noopener">GitHub Pages</a>.
      </p>

      <a class="footer__top" href="#top">
        Back to top
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-arrow-right"></use></svg>
      </a>
    </div>
  </div>
</footer>
