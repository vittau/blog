<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title and page.title != site.title %}{{ page.title }} &middot; {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta name="keywords" content="{{ site.keywords }}">
  <meta name="author" content="{{ site.author }}">
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">

  <meta content="website" property="og:type">
  <meta content="{{ site.title }}" property="og:site_name">
  <meta content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}" property="og:title">
  <meta content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}" property="og:description">
  <meta content="{{ page.url | absolute_url }}" property="og:url">
  <meta content="{% if page.image %}{{ page.image | absolute_url }}{% else %}{{ site.image | absolute_url }}{% endif %}" property="og:image">
  <meta name="twitter:card" content="summary">

  <link rel="icon" sizes="16x16 32x32" href="{{ '/favicon.ico' | relative_url }}">
  <link rel="icon" type="image/png" sizes="256x256" href="{{ '/favicon.png' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">

  <!-- Poppins 400 latin covers almost every glyph on the page; the other subsets
       are fetched on demand through the unicode-range declared in screen.css. -->
  <link rel="preload" href="{{ '/fonts/poppins-400-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>

  <!-- Theme must run before first paint, otherwise the wrong theme flashes. -->
  <script>
    (function () {
      var d = document.documentElement;
      d.classList.remove('no-js');
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || t === 'light') { d.setAttribute('data-theme', t); }
      } catch (e) { /* localStorage blocked: fall back to prefers-color-scheme */ }
    })();
  </script>

  <meta name="theme-color" content="#{{ site.color.light-bg }}" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#{{ site.color.dark-bg }}" media="(prefers-color-scheme: dark)">

  <link rel="stylesheet" href="{{ '/css/screen.css' | relative_url }}">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-NSNV8ZR1NV"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-NSNV8ZR1NV');
  </script>
</head>
