# Site settings
title: The Random Ramblings of a Software Developer
subtitle: "A blog about computer stuff. Mostly."
author: "Vitor Machado"
email: vmachado@cos.ufrj.br
description: "I live in Curitiba, Brazil. I'm a software architect with a doctorate in Artificial Intelligence, a music lover and a gamer."
baseurl: "/blog"
url: "https://www.vitormach.dev"
image: "/img/photo.webp"
excerpt_separator: <!--more--> #use this in posts to define how long the excerpt of the post (that is shown on the Blog page) is
github_username: "vittau"
instagram_username: "vitor.p.mach"
keywords: "blog,tech,developer"

# Pagination
paginate: 5

# Where the blog sends visitors back to. Used by the navbar brand and footer.
home_url: "https://www.vitormach.dev"

# Design tokens. Same palette as vitormach.dev (see DESIGN.md there); edit only
# this file to repaint the blog. Hex without the leading '#'. The *-rgb fields are
# the same values in decimal, used inside rgba(); keep them in sync with the hex
# next to them (the hex_to_rgb filter does not run on GitHub Pages).
color:
  # brand: a single accent, coral
  primary: CC6868                  # coral: decoration, borders, active state
  primary-rgb: "204, 104, 104"
  primary-ink-light: A5492F        # terracotta: text/links on the light theme (AA 5.1:1)
  primary-solid-light: AD4F38      # terracotta: button background with white text (AA 5.3:1)
  primary-ink-dark: E08A7E         # lightened coral: text/links on the dark theme (AA 7.2:1)
  # code highlighting only: strings (the one non-coral hue, for legibility)
  code-string-light: 56632F        # sage on --surface, AA 6.2:1
  code-string-dark: A7B57C         # sage on --surface, AA 7.8:1
  # dark theme: warm charcoal
  dark-bg: 141316
  dark-bg-rgb: "20, 19, 22"
  dark-surface: 1D1B20
  dark-text: F2EEE8
  dark-text-muted: A8A198
  # light theme: paper
  light-bg: F4F0E8
  light-bg-rgb: "244, 240, 232"
  light-surface: FBF9F5
  light-text: 26231F
  light-text-muted: 5F5850

# Social links. 'icon' is the id of a <symbol> in _includes/icons.html.
# 'nav: true' repeats the link in the navbar.
social:
  - title: GitHub
    handle: "@vittau"
    url: https://github.com/vittau
    icon: i-github
    nav: true
  - title: LinkedIn
    handle: in/vitormach
    url: https://www.linkedin.com/in/vitormach
    icon: i-linkedin
    nav: true
  - title: Instagram
    handle: "@vitor.p.mach"
    url: https://www.instagram.com/vitor.p.mach
    icon: i-instagram

# Build settings
markdown: kramdown
permalink: /:year/:month/:day/:title

# Sass
sass:
  style: :compressed

# Not published as part of the site (documentation for contributors/agents).
exclude:
  - CLAUDE.md
  - DESIGN.md
